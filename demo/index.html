<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AraLinks Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#F2464C;--brand-d:#C4232C;--brand-l:#FFE6E5;--brand-b:#FFB7B4;
  --green:#58CC02;--green-d:#58A700;--green-l:#D7FFB8;
  --blue:#1CB0F6;--blue-d:#1899D6;--blue-l:#DDF4FF;--blue-b:#84D8FF;
  --red:#FF4B4B;--red-d:#EA2B2B;--red-l:#FFDFE0;
  --yellow:#FFC800;--yellow-d:#E5A400;--yellow-l:#FFF5D3;
  --orange:#FF9600;--purple:#CE82FF;
  --ink:#3C3C3C;--muted:#777;--faint:#AFAFAF;--line:#E5E5E5;--line-d:#CECECE;--soft:#F7F7F7;--bg:#fff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,-apple-system,sans-serif;font-weight:700;color:var(--ink);background:var(--bg);line-height:1.4;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:900;letter-spacing:-.01em}
h1{font-size:28px}h2{font-size:22px}h3{font-size:17px}
p{margin:0}
a{color:var(--brand-d)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}

/* ---------- buttons ---------- */
.btn{--bgc:var(--brand);--sh:var(--brand-d);--fg:#fff;font:inherit;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--fg);background:var(--bgc);border:2px solid transparent;border-radius:16px;padding:12px 18px;cursor:pointer;
  box-shadow:0 4px 0 var(--sh);transition:transform .06s,box-shadow .06s,filter .1s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--sh)}
.btn.blue{--bgc:var(--blue);--sh:var(--blue-d)}
.btn.green{--bgc:var(--green);--sh:var(--green-d)}
.btn.red{--bgc:var(--red);--sh:var(--red-d)}
.btn.yellow{--bgc:var(--yellow);--sh:var(--yellow-d);--fg:#fff}
.btn.ghost{--bgc:#fff;--sh:var(--line);--fg:var(--brand);border-color:var(--line)}
.btn.ghost.red{--fg:var(--red)}
.btn.ghost.green{--fg:var(--green-d)}
.btn.ghost.plain{--fg:var(--muted)}
.btn[disabled]{--bgc:var(--line);--sh:var(--line-d);--fg:var(--faint);cursor:not-allowed;filter:none}
.btn[disabled]:active{transform:none;box-shadow:0 4px 0 var(--sh)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:12px;box-shadow:0 3px 0 var(--sh)}
.btn.sm:active{transform:translateY(3px)}
.linkbtn{background:none;border:0;font:inherit;font-weight:800;color:var(--blue);cursor:pointer;padding:0;text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--brand)}

/* ---------- form ---------- */
label.f{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;font:inherit;font-weight:700;font-size:15px;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:11px 14px;outline:none;transition:border-color .1s}
.input:focus{border-color:var(--brand-b);background:#fff}
textarea.input{resize:vertical;min-height:84px}
.input::placeholder{color:var(--faint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:7px 12px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;cursor:pointer;font-weight:800;font-size:13px;color:var(--muted);background:#fff;user-select:none}
.chip input:checked+span{border-color:var(--brand-b);background:var(--brand-l);color:var(--brand)}
.chip input:focus-visible+span{outline:2px solid var(--brand)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;padding:3px;gap:3px;background:#fff}
.seg button{font:inherit;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--brand-l);color:var(--brand)}

/* ---------- surfaces ---------- */
.card{border:2px solid var(--line);border-radius:18px;padding:18px;background:#fff}
.panel-title{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:900;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.green{background:var(--green-l);color:var(--green-d)}
.pill.blue{background:var(--blue-l);color:var(--blue-d)}
.pill.red{background:var(--red-l);color:var(--red-d)}
.pill.yellow{background:var(--yellow-l);color:#B88400}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:900;flex:none;border:3px solid #fff}
.empty{text-align:center;padding:28px 12px;color:var(--muted);display:grid;justify-items:center;gap:10px}
.stack{display:grid;gap:14px}
.hstack{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:900;padding:8px 8px;border-bottom:2px solid var(--line)}
table.t td{padding:12px 8px;border-bottom:2px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto;margin:0 -4px;padding:0 4px}

/* ---------- app layout ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;min-height:100vh}
.app.norail{grid-template-columns:250px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;border-right:2px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;background:#fff}
.logo{display:flex;align-items:center;gap:8px;font-size:28px;font-weight:900;color:var(--brand);letter-spacing:-.03em;padding:0 10px 22px}
.nav{display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:14px;border:2px solid transparent;text-transform:uppercase;font-weight:800;letter-spacing:.05em;color:var(--muted);font-size:14px;cursor:pointer;background:none;width:100%;text-align:left;font-family:inherit;position:relative}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--brand-l);border-color:var(--brand-b);color:var(--brand)}
.nav .ic{width:32px;height:32px;display:grid;place-items:center;font-size:24px;flex:none}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px}
.side .spacer{flex:1}
.side .who{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:2px solid var(--line);margin-top:8px;padding-top:14px}
.side .who small{display:block;color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.main{padding:28px 32px 60px;min-width:0}
.main-inner{max-width:900px;margin:0 auto}
.rail{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 24px 28px 8px;display:grid;align-content:start;gap:16px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.pagehead p{color:var(--muted);margin-top:4px}
.mstats{display:none;gap:16px;margin-bottom:18px;font-size:17px;font-weight:900}
.mstats span{display:inline-flex;gap:6px;align-items:center}

.statrow{display:flex;gap:18px;font-size:18px;font-weight:900}
.statrow span{display:inline-flex;align-items:center;gap:6px}
.fire{color:var(--orange)}.gem{color:var(--blue)}.bolt{color:var(--yellow-d)}
.prog{height:16px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--yellow);border-radius:99px}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.prog.green i{background:var(--green)}
.prog.blue i{background:var(--brand)}

.tip{display:flex;gap:12px;align-items:flex-end}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;background:#fff;flex:1}
.bubble::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

/* ---------- class cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.ccard{border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;overflow:hidden;background:#fff;cursor:pointer;display:flex;flex-direction:column;transition:transform .1s}
.ccard:hover{transform:translateY(-2px)}
.ccard-top{position:relative;padding:16px 16px 22px;color:#fff;background:var(--c);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 8px,transparent 8px 16px)}
.ccard-top h3{font-size:18px;line-height:1.2;margin:6px 0 4px;padding-right:8px}
.ccard-top p{font-size:13px;opacity:.95}
.ccard-ic{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:20px}
.ccard-av{position:absolute;right:14px;bottom:-22px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.ccard-body{padding:16px 16px 10px;display:grid;gap:6px;font-size:14px;color:var(--muted);flex:1}
.slots{display:flex;align-items:center;gap:10px;margin-top:6px}
.slots .prog{flex:1;height:12px}
.slots span{font-size:13px;font-weight:900;color:var(--ink)}
.ccard-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 16px;gap:8px}
.star{color:var(--yellow-d);font-weight:900}

.tcard{border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:18px;display:grid;gap:12px;cursor:pointer;background:#fff}
.tcard:hover{transform:translateY(-2px)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 9px;border-radius:10px;border:2px solid var(--line);color:var(--muted);background:#fff}

/* class detail */
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
.hero-c{border-radius:20px;overflow:hidden;border:2px solid var(--line);border-bottom-width:5px}
.hero-c .ccard-top{padding:22px 22px 30px}
.hero-c .ccard-top h3{font-size:24px}
.hero-c .ccard-av{bottom:-28px}
.tutees{display:flex;gap:8px;flex-wrap:wrap}
.tutees .dot{width:40px;height:40px;border-radius:50%;border:3px dashed var(--line-d)}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-weight:900;font-size:13px;letter-spacing:.1em}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}
.lock{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted)}
.linkbox{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--green-l);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--green-d);flex-wrap:wrap}

/* stars */
.stars{display:flex;gap:6px}
.stars button{font-size:34px;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);padding:2px;transition:transform .1s}
.stars button.on{color:var(--yellow)}
.stars button:hover{transform:scale(1.15)}

/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#FFF3F2,#fff 60%)}
.auth-top{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;max-width:1100px;width:100%;margin:0 auto}
.auth-main{flex:1;display:grid;grid-template-columns:1fr 420px;gap:48px;align-items:center;max-width:1000px;width:100%;margin:0 auto;padding:12px 24px 48px}
.auth-hero{display:grid;justify-items:center;text-align:center;gap:18px}
.auth-hero h1{font-size:34px;line-height:1.15;max-width:440px}
.auth-hero p{color:var(--muted);max-width:420px;font-size:17px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.demo-acc{display:flex;flex-wrap:wrap;gap:8px}
.demo-acc button{font:inherit;font-size:13px;font-weight:800;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:#fff;padding:6px 10px;cursor:pointer;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.demo-acc button:active{border-bottom-width:2px;transform:translateY(2px)}

/* sheet & celebration */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:22px 24px calc(26px + env(safe-area-inset-bottom, 0px));transform:translateY(110%);transition:transform .22s cubic-bezier(.2,.9,.3,1.2)}
.sheet.show{transform:none}
.sheet.ok{background:var(--green-l);color:var(--green-d)}
.sheet.err{background:var(--red-l);color:var(--red-d)}
.sheet-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.sheet .ico{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;flex:none}
.sheet h3{font-size:22px}
.sheet .mono{opacity:.8;margin-top:4px;display:block}
.overlay{position:fixed;inset:0;z-index:70;background:#fff;display:grid;place-items:center;padding:24px;animation:fade .2s}
.overlay .in{position:relative;z-index:72;display:grid;justify-items:center;gap:16px;text-align:center;max-width:440px}
.overlay h1{color:var(--brand);font-size:32px}
.xpbox{display:inline-grid;border:2px solid var(--yellow);border-radius:16px;overflow:hidden;min-width:130px}
.xpbox b{background:var(--yellow);color:#fff;font-size:12px;letter-spacing:.08em;padding:4px 10px;text-transform:uppercase}
.xpbox span{padding:10px;font-size:22px;color:var(--yellow-d);font-weight:900}
.bounce{animation:bounce 1s ease-in-out infinite alternate}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:71}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
@keyframes fade{from{opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}

.oop{position:fixed;right:16px;bottom:16px;z-index:40}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .app{grid-template-columns:230px minmax(0,1fr)}
  .rail{display:none}
  .mstats{display:flex}
}
@media (max-width:860px){
  .detail{grid-template-columns:1fr}
  .auth-main{grid-template-columns:1fr;gap:20px}
  .auth-hero h1{font-size:26px}
  .auth-hero .big-m{display:none}
}
@media (max-width:760px){
  .app,.app.norail{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;border-right:0;border-top:2px solid var(--line);z-index:30;padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px));justify-content:space-around;gap:2px}
  .logo,.nav .lbl,.side .who,.side .spacer,.side .extra{display:none}
  .nav{width:auto;padding:6px 10px;justify-content:center}
  .nav .badge{position:absolute;top:0;right:0;margin:0;font-size:10px;padding:0 6px}
  .main{padding:18px 16px 110px}
  .row2{grid-template-columns:1fr}
  .auth-top{padding:14px 16px}
  .auth-main{padding:8px 16px 40px}
  h1{font-size:24px}
  .sheet{padding:18px 16px 22px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet"></div>

<script>

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2,8);
const me = () => S.users.find(u => u.id === S.me);
const user = id => S.users.find(u => u.id === id);
const course = id => S.courses.find(c => c.id === id);
const cls = id => S.classes.find(c => c.id === id);
const mins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const t12 = t => { let [h,m] = t.split(':').map(Number); const ap = h>=12?'PM':'AM'; h = h%12||12; return `${h}:${String(m).padStart(2,'0')} ${ap}`; };
const sched = c => `${c.days.join(', ')} · ${t12(c.start)}–${t12(c.end)}`;
const first = n => n.split(' ')[0];
const initials = n => n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
const avatar = (u, s=40, extra='') => `<span class="av ${extra}" style="width:${s}px;height:${s}px;background:${u.color};font-size:${Math.round(s*.38)}px" title="${esc(u.name)}">${initials(u.name)}</span>`;
const isFull = c => c.learners.length >= c.max;
const pct = (a,b) => Math.min(100, Math.round(a/b*100));
function rating(tid){ // Tutor.computeAverageRating()
  const r = S.reviews.filter(v => v.tutorId === tid);
  return r.length ? { avg:(r.reduce((a,v)=>a+v.rating,0)/r.length).toFixed(1), n:r.length } : { avg:'New', n:0 };
}
function ago(t){ const m = Math.round((Date.now()-t)/6e4); if(m<1) return 'just now'; if(m<60) return m+'m ago'; const h=Math.round(m/60); if(h<24) return h+'h ago'; return Math.round(h/24)+'d ago'; }
const statusPill = c => c.status==='completed' ? '<span class="pill green">Completed</span>'
  : c.status==='cancelled' ? '<span class="pill red">Cancelled</span>'
  : c.status==='removed' ? '<span class="pill red">Removed</span>'

const reqPill = r => r.status==='pending' ? '<span class="pill yellow">Pending</span>' : r.status==='accepted' ? '<span class="pill green">Accepted</span>' : r.status==='cancelled' ? '<span class="pill">Cancelled</span>' : '<span class="pill red">Declined</span>';
function gainXP(id, n){ S.xp[id] = (S.xp[id]||0) + n; S.today[id] = (S.today[id]||0) + n; }
function logEvent(text){ S.log.unshift({text, at:Date.now()}); S.log = S.log.slice(0,30); }

/* ---------- feedback sheet + celebration ---------- */
let sheetTimer;
function sheet(kind, title, msg, code){
  const el = document.getElementById('sheet');
  clearTimeout(sheetTimer);
  el.className = 'sheet ' + (kind==='ok' ? 'ok' : 'err');
  el.innerHTML = `<div class="sheet-in">
    <div class="hstack" style="gap:16px">
      <div class="ico">${kind==='ok' ? '✔️' : '✖️'}</div>
      <div><h3>${esc(title)}</h3><div style="font-size:15px">${esc(msg)}</div>${code ? `<span class="mono">${esc(code)}</span>` : ''}</div>
    </div>
    <button class="btn ${kind==='ok'?'green':'red'}" data-a="closeSheet">${kind==='ok'?'Continue':'Got it'}</button>
  </div>`;
  requestAnimationFrame(() => el.classList.add('show'));
  if(kind==='ok') sheetTimer = setTimeout(closeSheet, 3200);
}
function closeSheet(){ document.getElementById('sheet').classList.remove('show'); }
function celebrate(title, sub, xp, method){
  closeSheet();
  const colors = ['#58CC02','#1CB0F6','#FFC800','#FF4B4B','#CE82FF','#FF9600'];
  const bits = Array.from({length:60}, () => `<i style="left:${Math.random()*100}%;background:${colors[Math.random()*6|0]};animation-duration:${1.6+Math.random()*1.8}s;animation-delay:${Math.random()*.6}s;transform:rotate(${Math.random()*360}deg)"></i>`).join('');
  const o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML = `<div class="confetti">${bits}</div><div class="in">
    <div class="bounce">${mascot(150,'wow')}</div>
    <h1>${esc(title)}</h1>
    <p class="muted" style="font-size:17px">${esc(sub)}</p>
    ${xp ? `<div class="xpbox"><b>XP earned</b><span>⚡ +${xp}</span></div>` : ''}
    ${method ? `<span class="mono faint">${esc(method)}</span>` : ''}
    <button class="btn block" style="margin-top:10px;min-width:260px" data-a="closeOverlay">Continue</button>
  </div>`;
  document.body.appendChild(o);
}

/* in-page confirm dialog (browser dialogs are blocked when the page is shared) */
function ask(title, msg, d, action, label){
  const attrs = Object.entries(d).filter(([k]) => k !== 'a' && k !== 'ok').map(([k,val]) => `data-${k}="${esc(val)}"`).join(' ');
  const o = document.createElement('div');
  o.className = 'overlay'; o.style.background = 'rgba(0,0,0,.45)';
  o.innerHTML = `<div class="card stack" style="max-width:380px;width:100%;text-align:center;justify-items:center;padding:28px">
    ${mascot(90,'sad')}<h2>${esc(title)}</h2><p class="muted">${esc(msg)}</p>
    <button class="btn red block" data-a="${action}" data-ok="1" ${attrs}>${esc(label)}</button>
    <button class="btn ghost plain block" data-a="closeOverlay">Keep it</button></div>`;
  document.body.appendChild(o);
}

function vSessions(u){
  const list = S.classes.filter(c => c.learners.includes(u.id) && c.status!=='removed').sort((a,b) => (a.status==='completed')-(b.status==='completed'));
  const target = ui.rateTarget && cls(ui.rateTarget);
  const row = c => {
    const rev = S.reviews.find(v => v.classId===c.id && v.learnerId===u.id);
    const act = c.status==='completed' ? (rev ? `<span class="star">★ ${rev.rating}</span>` : c.attendance[u.id] ? `<button class="btn ghost sm" data-a="pickRate" data-id="${c.id}">Rate</button>` : '<span class="faint" style="font-size:12px">Absent</span>')
              : c.status==='open' ? `<button class="btn ghost red sm" data-a="leaveClass" data-id="${c.id}">Leave</button>` : '';
    return `<tr><td><b>${esc(c.title)}</b><div class="muted" style="font-size:13px">${esc(user(c.tutorId).name)}</div></td><td>${c.learners.length}</td><td>${statusPill(c)}</td><td style="text-align:right">${act}</td></tr>`;
  };
  return `<div class="pagehead"><div><h1>Sessions</h1><p>Your session history. Rate completed sessions to help other learners.</p></div></div>
  <div class="detail" style="grid-template-columns:1.4fr 1fr">
    <div class="card"><div class="panel-title">Session history</div>
      ${list.length ? `<div class="tscroll"><table class="t"><tr><th>Class / Tutor</th><th>Tutees</th><th>Status</th><th></th></tr>${list.map(row).join('')}</table></div>` : emptyState('No sessions yet','Join a class first.','sleepy')}
    </div>
    <div class="card stack">
      <div class="panel-title" style="margin:0">Rate session</div>
      ${target ? `<form class="stack" data-f="review" data-id="${target.id}">
          <div><b>${esc(target.title)}</b><div class="muted" style="font-size:14px">with ${esc(user(target.tutorId).name)}</div></div>
          <div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button type="button" data-a="star" data-n="${n}" aria-label="${n} stars">★</button>`).join('')}</div>
          <input type="hidden" name="rating" id="ratingVal" value="0">
          <label class="f">Comment<textarea class="input" name="comment" placeholder="How was the session?"></textarea></label>
          <button class="btn block" type="submit">Submit review</button>
          <button class="btn ghost plain block" type="button" data-a="pickRate" data-id="">Cancel</button>
        </form>`
      : `<div class="empty">${mascot(100,'point')}<p>Tap <b>Rate</b> on a completed session to leave feedback.</p></div>`}
    </div>
  </div>`;
}

        return `<tr><td><b>${esc(c.title)}</b><div class="faint" style="font-size:12px">${sched(c)}</div></td><td>${att}/${c.learners.length}</td><td>₱${att*c.rate}</td><td class="star">★ ${avg}</td></tr>`;}).join('')}</table></div>

  authTab:d => { ui.authTab = d.t; render(); },
  fillDemo:d => { const f = document.getElementById('authForm'); f.srCode.value = d.sr; f.password.value = 'demo123'; f.role.value = d.role; },
  fillLogout:d => { S.me = null; save(); ui.authTab='login'; ui.view=null; render(); A.fillDemo(d); },
  logout:() => { S.me = null; ui.view = null; save(); render(); },
  reset:d => { if(!d.ok) return ask('Reset all demo data?', 'Everything goes back to the starting classes, requests and reviews.', d, 'reset', 'Reset'); const m = S.me; S = seed(); S.me = m; save(); ui.view = null; render(); sheet('ok','Demo reset','All data is back to the starting state.'); },
  browseMode:d => { ui.browseMode = d.m; render(); },
  openClass:d => { prev = {view:ui.view, params:ui.params}; go('classdetail', {id:d.id}); },
  openTutor:d => { prev = {view:ui.view, params:ui.params}; go('tutorprofile', {id:d.id}); },
  manage:d => go('tclass', {id:d.id}),

  // Learner.submitRequest() for a group class
  joinClass:d => {
    const u = me(), c = cls(d.id), msg = (document.getElementById('joinMsg')?.value || '').trim();
    if(c.status !== 'open') fail('ClassClosedException', 'This class is no longer open.');
    if(c.learners.includes(u.id)) fail('AlreadyEnrolledException', 'You are already in this class.');
    if(S.requests.some(r => r.classId===c.id && r.learnerId===u.id && r.status==='pending')) fail('DuplicateRequestException', 'You already asked to join this class.');
    if(isFull(c)) fail('ClassFullException', `No slots left (${c.learners.length}/${c.max}). Choose another class.`);
    S.requests.push({id:uid('r'), type:'join', learnerId:u.id, tutorId:c.tutorId, classId:c.id, courseId:c.courseId, message:msg, status:'pending', at:Date.now()});
    gainXP(u.id, 10); logEvent(`${u.name} asked to join “${c.title}”`); save(); render();
    celebrate('Request sent!', `${first(user(c.tutorId).name)} will review your request to join ${c.title}.`, 10, 'learner.submitRequest(tutoringClass)');
  },
  // TutoringClass.removeLearner()
  leaveClass:d => {
    const u = me(), c = cls(d.id);
    if(!d.ok) return ask(`Leave “${c.title}”?`, 'Your seat opens up for other learners.', d, 'leaveClass', 'Leave');
    c.learners = c.learners.filter(x => x !== u.id);
    logEvent(`${u.name} left “${c.title}”`); save(); render();
    sheet('ok', 'You left the class', `Your seat in ${c.title} is open again.`, 'tutoringClass.removeLearner(learner)');
  },
  // Learner.cancelRequest()
  cancelRequest:d => {
    const r = S.requests.find(x => x.id===d.id);
    if(!r || r.status!=='pending') fail('InvalidRequestStateException', 'Only pending requests can be cancelled.');
    r.status = 'cancelled'; save(); render();
    sheet('ok', 'Request cancelled', 'The tutor will no longer see it.', 'learner.cancelRequest(request)');
  },
  pickRate:d => { ui.rateTarget = d.id || null; render(); },
  star:d => {
    document.getElementById('ratingVal').value = d.n;
    document.querySelectorAll('#stars button').forEach((b,i) => b.classList.toggle('on', i < +d.n));
  },

  // Tutor.acceptRequest()
  accept:d => {
    const u = me(), r = S.requests.find(x => x.id===d.id), l = user(r.learnerId);
    if(r.status !== 'pending') fail('InvalidRequestStateException', 'This request was already handled.');
    if(r.type === 'join'){
      const c = cls(r.classId);
      if(isFull(c)) fail('ClassFullException', `“${c.title}” is full (${c.learners.length}/${c.max}). Enrollment is closed.`);
      c.learners.push(l.id); r.status = 'accepted';
      logEvent(`${u.name} accepted ${l.name} into “${c.title}”`); save(); render();
      sheet('ok', isFull(c) ? 'Accepted — class is now full!' : `${first(l.name)} joined!`, isFull(c) ? 'Enrollment closed automatically.' : `${c.learners.length}/${c.max} seats filled.`, 'tutor.acceptRequest(request) → tutoringClass.addLearner(learner)');
    } else {
      const k = {id:uid('k'), kind:'private', title:`Private · ${course(r.courseId).name}`, courseId:r.courseId, tutorId:u.id, days:[r.day], start:r.start, end:r.end, max:1,
        rate:Math.round(u.hourlyRate*(mins(r.end)-mins(r.start))/60), platform:'Google Meet', link:'', learners:[l.id], status:'open', attendance:{}};
      S.classes.push(k); r.status = 'accepted'; gainXP(u.id, 10);
      logEvent(`${u.name} accepted a private session with ${l.name}`); save(); go('tclass', {id:k.id});
      sheet('ok', 'Session scheduled!', `Add a classroom link so ${first(l.name)} can join.`, 'tutor.acceptRequest(request) → new TutoringSession().schedule()');
    }
  },
  // Tutor.declineRequest()
  decline:d => {
    const u = me(), r = S.requests.find(x => x.id===d.id);
    r.status = 'declined'; logEvent(`${u.name} declined a request from ${user(r.learnerId).name}`); save(); render();
    sheet('ok', 'Request declined', `${user(r.learnerId).name} will see it as declined.`, 'tutor.declineRequest(request)');
  },
  removeLearner:d => {
    const c = cls(d.id); if(!d.ok) return ask(`Remove ${user(d.l).name}?`, 'They will be taken out of this class.', d, 'removeLearner', 'Remove');
    c.learners = c.learners.filter(x => x !== d.l); save(); render();
    sheet('ok', 'Learner removed', 'A slot opened up.', 'tutoringClass.removeLearner(learner)');
  },
  // TutoringSession.markCompleted() / Tutor.completeSession()
  complete:d => {
    const u = me(), c = cls(d.id);
    document.querySelectorAll('.att').forEach(b => c.attendance[b.value] = b.checked);
    c.learners.forEach(id => { if(!(id in c.attendance)) c.attendance[id] = false; });
    c.status = 'completed';
    S.requests.filter(r => r.classId===c.id && r.status==='pending').forEach(r => r.status='declined');
    gainXP(u.id, 25); logEvent(`${u.name} completed “${c.title}”`); save(); render();
    celebrate('Session complete!', 'Attendance saved. Your learners can now rate this session.', 25, 'tutor.completeSession(session) → session.markCompleted()');
  },
  // TutoringSession.cancel()
  cancelClass:d => {
    const c = cls(d.id); if(!d.ok) return ask(`Cancel “${c.title}”?`, 'Learners will see it as cancelled.', d, 'cancelClass', 'Cancel class');
    c.status = 'cancelled'; S.requests.filter(r => r.classId===c.id && r.status==='pending').forEach(r => r.status='declined');
    logEvent(`${me().name} cancelled “${c.title}”`); save(); render();
    sheet('ok', 'Class cancelled', 'Pending join requests were declined.', 'session.cancel()');
  },
  // Tutor.addCourse() / removeCourse()
  addCourse:() => {
    const u = me(), id = document.getElementById('addCourseSel')?.value;
    if(!id) fail('NoCourseSelectedException', 'You already teach every course on the list.');
    u.courses.push(id); save(); render(); sheet('ok', 'Course added', course(id).name, 'tutor.addCourse(course)');
  },
  removeCourse:d => {
    const u = me();
    if(S.classes.some(c => c.tutorId===u.id && c.courseId===d.id && c.status==='open')) fail('CourseInUseException', `You still have open classes for ${course(d.id).name}.`);
    u.courses = u.courses.filter(c => c !== d.id); save(); render(); sheet('ok', 'Course removed', course(d.id).name, 'tutor.removeCourse(course)');
  },
  removeAvail:d => { const u = me(); u.availability.splice(+d.i, 1); save(); render(); },
  // Administrator.manageUser()
  toggleUser:d => {
    const x = user(d.id); x.active = !x.active; logEvent(`Admin ${x.active?'activated':'deactivated'} ${x.name}`); save(); render();
    sheet('ok', x.active ? 'Account activated' : 'Account deactivated', x.active ? `${x.name} can log in again.` : `${x.name} can no longer log in.`, 'administrator.manageUser(user)');
  },
  // Administrator.removeListing()
  removeListing:d => {
    const c = cls(d.id); if(!d.ok) return ask(`Remove “${c.title}”?`, 'The listing will be hidden from learners.', d, 'removeListing', 'Remove');
    c.status = 'removed'; logEvent(`Admin removed listing “${c.title}”`); save(); render();
    sheet('ok', 'Listing removed', `${c.title} is hidden from learners.`, 'administrator.removeListing(tutoringClass)');
  },
};

const F = {
  // User.login() — polymorphism: the role decides which menu (displayMenu) you land on
  login:fd => {
    const sr = v(fd,'srCode'), pw = v(fd,'password'), role = v(fd,'role');
    if(!/^\d{2}-\d{5}$/.test(sr)) fail('InvalidInputException', 'SR-Code must look like 00-00000.');
    const u = S.users.find(x => x.srCode === sr);
    if(!u || u.password !== pw) fail('InvalidCredentialsException', 'Wrong SR-Code or password. Try a demo account below.');
    if(u.role !== role) fail('RoleMismatchException', `This account is registered as ${u.role}, not ${role}.`);
    if(!u.active) fail('AccountDisabledException', 'This account was deactivated by an administrator.');
    S.me = u.id; ui.view = null; save(); render();
    sheet('ok', `Welcome back, ${first(u.name)}!`, u.role==='Administrator' ? 'Ready to manage AraLinks.' : `You're on a ${S.streak[u.id]||0}-day streak 🔥`, `${u.role.toLowerCase()}.login() → displayMenu()`);
  },
  register:fd => {
    const name = v(fd,'name'), sr = v(fd,'srCode'), email = v(fd,'email'), pw = v(fd,'password'), role = v(fd,'role');
    if(name.length < 2) fail('InvalidInputException', 'Please enter your full name.');
    if(!/^\d{2}-\d{5}$/.test(sr)) fail('InvalidInputException', 'SR-Code must look like 00-00000.');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) fail('InvalidInputException', 'That email doesn\'t look right.');
    if(pw.length < 6) fail('InvalidInputException', 'Password needs at least 6 characters.');
    if(S.users.some(u => u.srCode === sr)) fail('DuplicateAccountException', 'An account with that SR-Code already exists.');
    const colors = ['#1CB0F6','#58CC02','#FF9600','#CE82FF','#FF4B4B','#00B894'];
    const u = {id:uid('u'), role, srCode:sr, name, email, password:pw, university:'BatStateU – Alangilan', active:true, color:colors[Math.random()*6|0], program:v(fd,'program')||'Undeclared', yearLevel:+v(fd,'yearLevel')||1};
    if(role === 'Tutor') Object.assign(u, {courses:[], hourlyRate:150, mode:'Online', availability:[], bio:'New tutor on AraLinks!'});
    S.users.push(u); S.me = u.id; S.xp[u.id] = 0; S.streak[u.id] = 1; logEvent(`${name} registered as ${role}`);
    ui.view = role==='Tutor' ? 'profile' : null; save(); render();
    celebrate('Welcome to AraLinks!', role==='Tutor' ? 'Set up your courses, rate, and availability so learners can find you.' : 'Let\'s find you a class or a tutor.', 0, `new ${role}(…).register()`);
  },
  search:fd => { ui.q = v(fd,'q'); ui.subj = v(fd,'subj'); ui.day = v(fd,'day'); renderGrid(); },
  tsearch:fd => { ui.tq = v(fd,'tq'); ui.tcourse = v(fd,'tcourse'); ui.tmax = +v(fd,'tmax'); renderGrid(); },
  // Learner.submitRequest() for a private session — checks the tutor's availability
  private:(fd, f) => {
    const u = me(), t = user(f.dataset.tid), day = v(fd,'day'), s = v(fd,'start'), e = v(fd,'end');
    if(!s || !e || mins(e) <= mins(s)) fail('InvalidScheduleException', 'End time must be after the start time.');
    const slot = t.availability.find(a => a.day===day && mins(s) >= mins(a.start) && mins(e) <= mins(a.end));
    if(!slot){
      const onDay = t.availability.filter(a => a.day===day);
      fail('UnavailableScheduleException', onDay.length ? `${first(t.name)} is only free ${day} ${onDay.map(a=>`${t12(a.start)}–${t12(a.end)}`).join(', ')}.` : `${first(t.name)} isn't available on ${day}. Try ${t.availability.map(a=>a.day).join(', ')}.`);
    }
    if(S.requests.some(r => r.type==='private' && r.learnerId===u.id && r.tutorId===t.id && r.status==='pending')) fail('DuplicateRequestException', `You already have a pending request with ${first(t.name)}.`);
    S.requests.push({id:uid('r'), type:'private', learnerId:u.id, tutorId:t.id, courseId:v(fd,'courseId'), day, start:s, end:e, message:v(fd,'message'), status:'pending', at:Date.now()});
    gainXP(u.id, 10); logEvent(`${u.name} requested a private session with ${t.name}`); save(); go('myclasses');
    celebrate('Request sent!', `${first(t.name)} will accept or decline your ${day} session.`, 10, 'learner.submitRequest(tutor, schedule)');
  },
  // Review.validateRating() + Learner.rateSession()
  review:(fd, f) => {
    const u = me(), c = cls(f.dataset.id), n = +v(fd,'rating');
    if(n < 1 || n > 5) fail('InvalidRatingException', 'Pick 1 to 5 stars first.');
    if(c.status !== 'completed') fail('SessionNotCompletedException', 'You can only rate completed sessions.');
    if(S.reviews.some(r => r.classId===c.id && r.learnerId===u.id)) fail('DuplicateReviewException', 'You already rated this session.');
    S.reviews.push({id:uid('v'), classId:c.id, learnerId:u.id, tutorId:c.tutorId, rating:n, comment:v(fd,'comment'), at:Date.now()});
    gainXP(u.id, 15); ui.rateTarget = null; logEvent(`${u.name} rated “${c.title}” ${n}★`); save(); render();
    celebrate('Thanks for the feedback!', `${first(user(c.tutorId).name)}'s rating is now ★ ${rating(c.tutorId).avg}.`, 15, 'learner.rateSession(session, rating) → tutor.computeAverageRating()');
  },
  // TutoringClass constructor + validation
  createClass:fd => {
    const u = me(), title = v(fd,'title'), courseId = v(fd,'courseId'), days = fd.getAll('days'), s = v(fd,'start'), e = v(fd,'end'), max = Number(v(fd,'max')), rate = Number(v(fd,'rate')), link = v(fd,'link');
    if(title.length < 3) fail('InvalidInputException', 'Give your class a title (3+ characters).');
    if(!courseId) fail('InvalidInputException', 'Pick a subject you teach.');
    if(!days.length) fail('InvalidScheduleException', 'Pick at least one day.');
    if(!s || !e || mins(e) <= mins(s)) fail('InvalidScheduleException', 'End time must be after the start time.');
    if(!Number.isInteger(max) || max < 2 || max > 50) fail('InvalidCapacityException', 'Max tutees must be a whole number from 2 to 50.');
    if(v(fd,'rate')==='' || !(rate >= 0) || rate > 5000) fail('InvalidRateException', 'Enter a rate from ₱0 to ₱5,000.');
    if(link && !/^https?:\/\/\S+\.\S+/.test(link)) fail('InvalidLinkException', 'Classroom link must start with http:// or https://');
    const c = {id:uid('k'), kind:'group', title, courseId, tutorId:u.id, days, start:s, end:e, max, rate, platform:v(fd,'platform'), link, learners:[], status:'open', attendance:{}};
    S.classes.push(c); gainXP(u.id, 20); logEvent(`${u.name} published “${title}”`); save(); render();
    celebrate('Class published!', `${title} is now visible to learners in Browse.`, 20, 'new TutoringClass(…) → tutor.publishClass()');
  },
  // TutoringClass.setClassroomLink()
  link:(fd, f) => {
    const c = cls(f.dataset.id), link = v(fd,'link');
    if(link && !/^https?:\/\/\S+\.\S+/.test(link)) fail('InvalidLinkException', 'Classroom link must start with http:// or https://');
    c.link = link; c.platform = v(fd,'platform'); save(); render();
    sheet('ok', 'Classroom link saved', 'Enrolled learners can open it now.', 'tutoringClass.setClassroomLink(link)');
  },
  // User.updateProfile() / Tutor.setRate()
  profile:fd => {
    const u = me();
    if(v(fd,'name').length < 2) fail('InvalidInputException', 'Name can\'t be empty.');
    if(u.role==='Tutor'){
      const r = Number(v(fd,'hourlyRate'));
      if(!(r >= 50) || r > 5000) fail('InvalidRateException', 'Hourly rate must be between ₱50 and ₱5,000.');
      u.hourlyRate = r; u.bio = v(fd,'bio'); u.mode = v(fd,'mode');
    }
    u.name = v(fd,'name'); u.program = v(fd,'program'); u.yearLevel = +v(fd,'yearLevel'); save(); render();
    sheet('ok', 'Profile saved', 'Looking good!', u.role==='Tutor' ? 'tutor.updateProfile() · tutor.setRate(rate)' : 'learner.updateProfile()');
  },
  // Tutor.addAvailability()
  avail:fd => {
    const u = me(), day = v(fd,'day'), s = v(fd,'start'), e = v(fd,'end');
    if(!s || !e || mins(e) <= mins(s)) fail('InvalidScheduleException', 'End time must be after the start time.');
    if(u.availability.some(a => a.day===day && mins(s) < mins(a.end) && mins(e) > mins(a.start))) fail('ScheduleConflictException', `That overlaps hours you already set on ${day}.`);
    u.availability.push({day, start:s, end:e}); u.availability.sort((a,b) => DAYS.indexOf(a.day)-DAYS.indexOf(b.day) || mins(a.start)-mins(b.start)); save(); render();
    sheet('ok', 'Availability added', `${day} ${t12(s)}–${t12(e)}`, 'tutor.addAvailability(schedule)');
  },
};
const v = (fd, k) => String(fd.get(k) ?? '').trim();

function run(fn){
  try { fn(); }
  catch(e){
    if(e instanceof AppError){
      sheet('err', 'Oops!', e.message, `throw new ${e.name}()`);
      document.querySelector('form .btn[type=submit]:focus, .card form')?.classList.add('shake');
      setTimeout(() => document.querySelectorAll('.shake').forEach(x => x.classList.remove('shake')), 600);
    } else { console.error(e); sheet('err', 'Something broke', String(e.message || e)); }
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if(!t) return;
  const fn = A[t.dataset.a]; if(!fn) return;
  if(t.tagName !== 'A') e.preventDefault();
  e.stopPropagation();
  if(t.dataset.ok) A.closeOverlay();
  run(() => fn(t.dataset, t));
});
document.addEventListener('submit', e => {
  const f = e.target, fn = F[f.dataset.f]; if(!fn) return;
  e.preventDefault(); run(() => fn(new FormData(f), f));
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if(id === 'q'){ ui.q = e.target.value; renderGrid(); }
  if(id === 'tq'){ ui.tq = e.target.value; renderGrid(); }
  if(id === 'tmax'){ ui.tmax = +e.target.value; document.getElementById('tmaxv').textContent = `₱${ui.tmax}/hr`; renderGrid(); }
  if(e.target.matches('[data-cost]')){ // TutoringSession.computeCost()
    const f = e.target.form, t = user(f.dataset.tid), s = f.start.value, en = f.end.value;
    const h = s && en ? (mins(en)-mins(s))/60 : 0;
    document.getElementById('cost').textContent = h > 0 ? `₱${Math.round(t.hourlyRate*h)}` : '—';
  }
});
document.addEventListener('change', e => {
  if(e.target.id === 'subj'){ ui.subj = e.target.value; renderGrid(); }
  if(e.target.id === 'day'){ ui.day = e.target.value; renderGrid(); }
  if(e.target.id === 'tcourse'){ ui.tcourse = e.target.value; renderGrid(); }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeSheet(); A.closeOverlay(); } });

load(); render();
</script>
</body>
